project:
  type: book
  output-dir: _book
  render:                       # the pages only: README.md documents the folder and is not a page
    - "*.qmd"
  resources:
    - assets/oa.js
    - _generated/style.js
    - _generated/figs/**
    - _generated/data/**

book:
  title: "Social Security Design and Its Political Support"
  subtitle: "Online Appendix"
  author:
    - name: Rasmus K. S. Berg
      affiliation: University of Copenhagen
    - name: Martín Gonzalez-Eiras
      affiliation: University of Bologna
  chapters:
    - index.qmd
    - part: argentina.qmd
      chapters:
        - arg-designs.qmd
        - arg-ies.qmd
        - arg-leisure.qmd
    - part: oecd.qmd
      chapters:
        - oecd-ies.qmd
        - oecd-countries.qmd
        - oecd-parameters.qmd
        - oecd-leisure.qmd
    - part: esc.qmd
      chapters:
        - esc-paths.qmd
        - esc-countries.qmd
        - esc-costs.qmd
        - esc-parameters.qmd
        - esc-timing.qmd
    - part: checks.qmd
      chapters:
        - data.qmd
        - numerical.qmd
        - replication.qmd
  repo-url: https://github.com/ChampionApe/SSDclaude
  site-url: https://championape.github.io/SSDclaude
  search: true
  page-navigation: true
  sidebar:
    collapse-level: 1

bibliography: _generated/References.bib
lang: en

format:
  html:
    theme: [cosmo, assets/theme.scss]
    css: assets/oa.css
    toc: true
    toc-depth: 2
    toc-title: "On this page"
    number-sections: false
    html-math-method: mathjax
    html-table-processing: none
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: false
